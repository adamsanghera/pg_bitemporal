[project]
name = "pg_bitemporal"
version = "0.1.0"
description = "Define and interface with bitemporal data models in postgres"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Adam", email = "adamsanghera@gmail.com" }]
license = "MIT"
dependencies = []

# Pick the ORM you use. psycopg is left without [binary] so the application chooses
# how to install it; the dev group below uses the binary wheel.
[project.optional-dependencies]
sqlalchemy = [
    "psycopg>=3.3",
    "sqlalchemy>=2.1",
]
django = [
    "django>=6.1",
    "psycopg>=3.3",
]

[dependency-groups]
dev = [
    "pg_bitemporal[sqlalchemy,django]",
    "psycopg[binary]>=3.3",
    "pytest>=9",
    "ruff>=0.17",
    "ty>=0.0.95",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pg_bitemporal"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pg_bitemporal"]
# example/sqlalchemy and example/django are app folders, not the libraries.
known-third-party = ["django", "psycopg", "pytest", "sqlalchemy"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
unsupported-base = "ignore"
